<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Sift: AI Recruitment Desk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#1d1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .dot { fill: #9fb3ff; animation: fall 4s ease-in infinite; }
      .keep { fill: #c084fc; }
      @keyframes fall {
        0%   { transform: translateY(-30px); opacity: 0; }
        20%  { opacity: 1; }
        100% { transform: translateY(60px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- Sieve motif: many candidates fall in, a few are kept -->
  <g transform="translate(860 70)">
    <g>
      <circle class="dot" cx="40"  cy="10" r="5" style="animation-delay:0s"/>
      <circle class="dot" cx="80"  cy="0"  r="5" style="animation-delay:.6s"/>
      <circle class="dot" cx="120" cy="12" r="5" style="animation-delay:1.2s"/>
      <circle class="dot" cx="160" cy="4"  r="5" style="animation-delay:1.8s"/>
      <circle class="dot" cx="200" cy="8"  r="5" style="animation-delay:2.4s"/>
      <circle class="dot" cx="240" cy="2"  r="5" style="animation-delay:3s"/>
    </g>
    <path d="M10 80 L270 80 L200 150 L80 150 Z" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#7c9cff" stroke-opacity="0.5" stroke-width="1.5">
      <line x1="40"  y1="80" x2="95"  y2="150"/>
      <line x1="90"  y1="80" x2="120" y2="150"/>
      <line x1="140" y1="80" x2="140" y2="150"/>
      <line x1="190" y1="80" x2="160" y2="150"/>
      <line x1="240" y1="80" x2="185" y2="150"/>
    </g>
    <circle class="keep" cx="115" cy="178" r="7"/>
    <circle class="keep" cx="140" cy="182" r="7"/>
    <circle class="keep" cx="165" cy="178" r="7"/>
  </g>

  <text x="70" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#accent)">Sift</text>
  <text x="72" y="185" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e6e9ff">AI Recruitment Desk</text>
  <text x="72" y="225" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#a5adcf">From job description to shortlist, with evidence behind every score.</text>
</svg>
